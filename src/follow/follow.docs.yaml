paths:
  /follow/requests:
    get:
      tags: [Follow]
      summary: Get pending follow requests for current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Requests list
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                required: [requests]

  /follow/followings:
    post:
      tags: [Follow]
      summary: Get followings list (from followingsInfo payload)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                followingsInfo:
                  type: array
                  items:
                    type: object
                    properties:
                      to: { type: integer }
                    required: [to]
              required: [followingsInfo]
      responses:
        "200":
          description: Followings list
          content:
            application/json:
              schema:
                type: object
                properties:
                  followings:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                required: [followings]

  /follow/followers:
    post:
      tags: [Follow]
      summary: Get followers list (from followersInfo payload)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                followersInfo:
                  type: array
                  items:
                    type: object
                    properties:
                      from: { type: integer }
                    required: [from]
              required: [followersInfo]
      responses:
        "200":
          description: Followers list
          content:
            application/json:
              schema:
                type: object
                properties:
                  followers:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                required: [followers]

  /follow/requests/{id}/accept:
    patch:
      tags: [Follow]
      summary: Accept follow request
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
        "404":
          description: Not found

  /follow/requests/{id}/decline:
    patch:
      tags: [Follow]
      summary: Decline follow request
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
        "404":
          description: Not found

  /follow/{id}:
    post:
      tags: [Follow]
      summary: Follow/unfollow/request/cancel (toggle)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Follow toggled
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "201":
          description: Requested (private account)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid (self follow)
        "404":
          description: User not found
