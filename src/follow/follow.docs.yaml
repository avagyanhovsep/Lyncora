paths:
    /follow/requests:
        get:
            tags: [Follow]
            summary: Get my follow requests
            description: Returns pending follow requests for the authenticated user (approved = false).
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: Requests returned
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    requests:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                id:
                                                    type: integer
                                                    example: 12
                                                sender:
                                                    $ref: "../../docs/components.yaml#/components/schemas/UserSafe"
                                            required: [id, sender]
                                required: [requests]
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /follow/requests/accept:
        patch:
            tags: [Follow]
            summary: Accept a follow request
            description: Marks an existing follow request as approved.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                from:
                                    type: integer
                                    example: 10
                                to:
                                    type: integer
                                    example: 20
                            required: [from, to]
            responses:
                "200":
                    description: Follow request accepted
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                ok:
                                    value:
                                        message: "Follow request accepted"
                "404":
                    description: Request not found
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                not_found:
                                    value:
                                        message: "Not found"
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /follow/requests/decline:
        patch:
            tags: [Follow]
            summary: Decline a follow request
            description: Deletes an existing follow request.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                from:
                                    type: integer
                                    example: 10
                                to:
                                    type: integer
                                    example: 20
                            required: [from, to]
            responses:
                "200":
                    description: Follow request declined
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                ok:
                                    value:
                                        message: "Follow request declined"
                "404":
                    description: Request not found
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                not_found:
                                    value:
                                        message: "Not found"
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /follow/followings:
        post:
            tags: [Follow]
            summary: Resolve followings list
            description: |
                Accepts an array of follow relationships and resolves them into full user objects.
                Implementation fetches each user by `following.to`.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                followingsInfo:
                                    type: array
                                    items:
                                        type: object
                                        properties:
                                            to:
                                                type: integer
                                                example: 200
                                        required: [to]
                            required: [followingsInfo]
            responses:
                "200":
                    description: Followings returned
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    followings:
                                        type: array
                                        items:
                                            $ref: "../../docs/components.yaml#/components/schemas/UserSafe"
                                required: [followings]
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /follow/followers:
        post:
            tags: [Follow]
            summary: Resolve followers list
            description: |
                Accepts an array of follow relationships and resolves them into full user objects.
                Implementation fetches each user by `follower.from`.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                followersInfo:
                                    type: array
                                    items:
                                        type: object
                                        properties:
                                            from:
                                                type: integer
                                                example: 150
                                        required: [from]
                            required: [followersInfo]
            responses:
                "200":
                    description: Followers returned
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    followers:
                                        type: array
                                        items:
                                            $ref: "../../docs/components.yaml#/components/schemas/UserSafe"
                                required: [followers]
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /follow/{id}:
        post:
            tags: [Follow]
            summary: Follow / request / unfollow / cancel request
            description: |
                Toggles follow behavior depending on target privacy and existing relationship:

                - If `id` equals my user id -> 400 (cannot follow yourself)
                - If target user not found -> 404
                - If target is private:
                  - If no existing request -> creates request (approved=false, requested=true) and returns 201 Requested
                  - If existing request approved=false -> cancels request and returns 200 Cancelled
                  - If existing follow approved=true -> unfollow and returns 200 Unfollowed
                - If target is public:
                  - If already following -> unfollow and returns 200 Unfollowed
                  - Else -> creates follow via controller (approved=true, requested=false) and returns 200 Followed
            security:
                - bearerAuth: []
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: integer
                      example: 200
                  description: Target user id to follow/unfollow
            responses:
                "200":
                    description: Follow state updated
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: "Followed"
                                    result:
                                        type: object
                                        nullable: true
                                required: [status]
                            examples:
                                followed:
                                    value:
                                        status: "Followed"
                                        result:
                                            id: 123
                                            from: 10
                                            to: 200
                                            approved: true
                                unfollowed:
                                    value:
                                        status: "Unfollowed"
                                cancelled:
                                    value:
                                        status: "Cancelled"
                "201":
                    description: Follow request created (private account)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: "Requested"
                                    result:
                                        type: object
                                required: [status, result]
                            examples:
                                requested:
                                    value:
                                        status: "Requested"
                                        result:
                                            id: 456
                                            from: 10
                                            to: 200
                                            approved: false
                                            requested: true
                "400":
                    description: Invalid request (cannot follow yourself)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: "Invalid"
                                    message:
                                        type: string
                                        example: "You cannot follow yourself"
                                required: [status, message]
                "404":
                    description: Target user or request not found
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        nullable: true
                                    message:
                                        type: string
                                required: [message]
                            examples:
                                user_not_found:
                                    value:
                                        status: "NotFound"
                                        message: "User not found"
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"
