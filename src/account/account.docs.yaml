paths:
    /account/privacy:
        patch:
            tags: [Account]
            summary: Toggle account privacy
            description: Toggles `isAccountPrivate` for the authenticated user.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: Privacy updated
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    isAccountPrivate:
                                        type: boolean
                                        example: true
                                required: [isAccountPrivate]
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /account/settings/email:
        patch:
            tags: [Account]
            summary: Change my email
            description: Changes the authenticated user's email after password verification, and sends notification emails to old/new address.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                currentPasswordForEmail:
                                    type: string
                                    example: "Password123"
                                newEmail:
                                    type: string
                                    format: email
                                    example: "newjohn@example.com"
                            required: [currentPasswordForEmail, newEmail]
            responses:
                "200":
                    description: Email changed
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                ok:
                                    value:
                                        message: "Email changed successfully!"
                "400":
                    description: Validation error (missing fields, wrong password, reused email, email already in use)
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                missing:
                                    value:
                                        message: "Missing/Invalid credentials..."
                                wrong_password:
                                    value:
                                        message: "Your password is incorrect, please provide correct one or change if you forgot"
                                reused:
                                    value:
                                        message: "You already used this email previously, try another..."
                                email_in_use:
                                    value:
                                        message: "This email is already in use, try another..."
                "404":
                    description: User not found
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                not_found:
                                    value:
                                        message: "User not found..."
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /account/settings/password:
        patch:
            tags: [Account]
            summary: Change my password
            description: Changes the authenticated user's password after verifying the current password, and emails a notification.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                currentPasswordForPassword:
                                    type: string
                                    example: "Password123"
                                newPassword:
                                    type: string
                                    example: "Newpass123"
                            required: [currentPasswordForPassword, newPassword]
            responses:
                "200":
                    description: Password changed
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                ok:
                                    value:
                                        message: "Your password has been changed successfully"
                "400":
                    description: Validation error (missing fields, wrong password, reused password)
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                missing:
                                    value:
                                        message: "Missing/Invalid credentials..."
                                wrong_password:
                                    value:
                                        message: "Your current password is incorrect, try another or reset if you forgot"
                                reused:
                                    value:
                                        message: "You have used this password previously, try another"
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "404":
                    description: User not found
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /account/avatar:
        patch:
            tags: [Account]
            summary: Upload / change my avatar
            description: |
                Uploads a new profile picture (multipart/form-data field name: `profile-pic`).
                Requires auth. Validates file exists. Stores in S3 and returns `picture` URL.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            properties:
                                profile-pic:
                                    type: string
                                    format: binary
                            required: [profile-pic]
            responses:
                "200":
                    description: Avatar updated
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    picture:
                                        type: string
                                        example: "https://cdn.example.com/avatars/abc123.png"
                                required: [picture]
                "400":
                    description: Missing file
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                missing_file:
                                    value:
                                        message: "Profile picture is required."
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /account/bio:
        patch:
            tags: [Account]
            summary: Update my bio
            description: Updates bio for the authenticated user. Max length is 150 characters.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                bio:
                                    type: string
                                    example: "Building Lyncora."
                            required: [bio]
            responses:
                "200":
                    description: Bio updated
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    bio:
                                        type: string
                                        example: "Building Lyncora."
                                    message:
                                        type: string
                                        example: "Bio updated successfully!"
                                required: [bio, message]
                "400":
                    description: Bio too long
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                too_long:
                                    value:
                                        message: "Bio too long"
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /account/theme:
        patch:
            tags: [Account]
            summary: Update my theme
            description: Updates theme for the authenticated user.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                theme:
                                    type: string
                                    description: Theme preference
                                    enum: [system, light, dark]
                                    example: "dark"
                            required: [theme]
            responses:
                "200":
                    description: Theme updated
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    theme:
                                        type: string
                                        enum: [system, light, dark]
                                        example: "dark"
                                required: [theme]
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /account:
        delete:
            tags: [Account]
            summary: Delete my account
            description: |
                Deletes the authenticated user's account (transaction). Also cleans up chats and follow rows.
                Sends a confirmation email if an email exists.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: Account deleted
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                ok:
                                    value:
                                        message: "Account deleted"
                "404":
                    description: User not found
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                not_found:
                                    value:
                                        message: "User not found"
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /account/search/{text}:
        get:
            tags: [Account]
            summary: Search users by first name prefix
            description: Returns users whose `firstName` starts with `{text}`.
            security:
                - bearerAuth: []
            parameters:
                - in: path
                  name: text
                  required: true
                  schema:
                      type: string
                      example: "jo"
            responses:
                "200":
                    description: Users returned
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    users:
                                        type: array
                                        items:
                                            $ref: "../../docs/components.yaml#/components/schemas/UserSafe"
                                required: [users]
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /account/{username}:
        get:
            tags: [Account]
            summary: Get user profile by username
            description: Returns user profile (includes followings, followers, posts). Includes password internally in service but should not be exposed in docs.
            security:
                - bearerAuth: []
            parameters:
                - in: path
                  name: username
                  required: true
                  schema:
                      type: string
                      example: "john_doe"
            responses:
                "200":
                    description: User returned
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    user:
                                        $ref: "../../docs/components.yaml#/components/schemas/UserProfile"
                                required: [user]
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "404":
                    description: User not found
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                not_found:
                                    value:
                                        message: "User not found..."
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"
