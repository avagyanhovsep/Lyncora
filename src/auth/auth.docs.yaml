paths:
  /auth/user:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    additionalProperties: true
                required: [user]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]

  /auth/signup:
    post:
      tags: [Auth]
      summary: Signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string, example: John }
                lastName: { type: string, example: Doe }
                username: { type: string, example: john_doe7 }
                email: { type: string, format: email, example: john@example.com }
                password: { type: string, example: Passw0rd123 }
              required: [firstName, lastName, username, email, password]
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]

  /auth/signin:
    post:
      tags: [Auth]
      summary: Signin (email + password) -> generates OTP, returns token + endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, example: john@example.com }
                password: { type: string, example: Passw0rd123 }
              required: [email, password]
      responses:
        "200":
          description: Token + endpoint returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  token: { type: string }
                  endpoint: { type: string }
                required: [message, token, endpoint]
        "400":
          description: Wrong or missing credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]

  /auth/verify:
    post:
      tags: [Auth]
      summary: Verify OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, example: john@example.com }
                otp: { type: string, example: "123456" }
              required: [email, otp]
      responses:
        "200":
          description: Account verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
        "400":
          description: Wrong code / missing OTP
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
        "401":
          description: OTP expired (new code sent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
        "404":
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Forgot password (generates OTP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, example: john@example.com }
              required: [email]
      responses:
        "200":
          description: Reset email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
        "400":
          description: Missing email
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
        "404":
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password (email + new password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, example: john@example.com }
                password: { type: string, example: Newpass123 }
              required: [email, password]
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
        "400":
          description: Validation error / reused password
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
