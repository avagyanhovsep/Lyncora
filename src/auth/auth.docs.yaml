paths:
    /auth/signup:
        post:
            tags: [Auth]
            summary: Create a new user account
            description: Creates a user account and sends a welcome email.
            security: [] # public
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "../../docs/components.yaml#/components/schemas/SignupRequest"
            responses:
                "201":
                    description: Account created
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                created:
                                    value:
                                        message: "john_doe has signed up successfully!"
                "400":
                    description: Validation error (missing fields, invalid formats, already used username/email)
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                missing:
                                    value:
                                        message: "Missing/Invalid credentials..."
                                bad_firstname:
                                    value:
                                        message: "First name must be 2-18 letters."
                                bad_lastname:
                                    value:
                                        message: "Last name must be 2-18 letters."
                                bad_username:
                                    value:
                                        message: "Username must be 3-18 characters and use only letters, numbers, or underscores."
                                bad_email:
                                    value:
                                        message: "Email format is invalid."
                                bad_password:
                                    value:
                                        message: "Password must be 8-18 characters and include both letters and numbers."
                                email_in_use:
                                    value:
                                        message: "Email is already in use..."
                                username_in_use:
                                    value:
                                        message: "Username is already in use..."
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /auth/signin:
        post:
            tags: [Auth]
            summary: Sign in
            description: |
                Validates credentials. If the account is not verified (isSigninAllowed=false), an OTP may be re-sent.
                Returns a JWT token and a suggested frontend redirect endpoint.
            security: [] # public
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "../../docs/components.yaml#/components/schemas/SigninRequest"
            responses:
                "200":
                    description: Sign-in accepted (token issued; OTP may have been sent depending on account status)
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/SigninResponse"
                            examples:
                                ok_verified:
                                    value:
                                        message: "Code sent, please check your email to confirm the account..."
                                        token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                                        endpoint: "/profile"
                                ok_needs_verify:
                                    value:
                                        message: "Code sent, please check your email to confirm the account..."
                                        token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                                        endpoint: "/signin/confirm-your-account"
                "400":
                    description: Invalid credentials or wrong password/email
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                missing:
                                    value:
                                        message: "Invalid/Missing credentials!"
                                wrong:
                                    value:
                                        message: "Wrong Credentials..."
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /auth/verify:
        post:
            tags: [Auth]
            summary: Verify account using OTP
            description: |
                Verifies an account using email + otp. If OTP is expired, a new OTP is generated and emailed,
                and the response returns 400 with an "expired" message.
            security: [] # public
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "../../docs/components.yaml#/components/schemas/VerifyRequest"
            responses:
                "200":
                    description: Account verified
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                success:
                                    value:
                                        message: "Account verified successfully!"
                "400":
                    description: Wrong/expired OTP or missing fields
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                missing:
                                    value:
                                        message: "Unverified..."
                                expired:
                                    value:
                                        message: "The code is expired, we sent you the new one, please check your email..."
                                wrong_code:
                                    value:
                                        message: "Wrong code"
                "404":
                    $ref: "../../docs/components.yaml#/components/responses/NotFound"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /auth/forgot-password:
        post:
            tags: [Auth]
            summary: Request password reset OTP
            description: Generates an OTP and emails it to the user for password reset.
            security: [] # public
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "../../docs/components.yaml#/components/schemas/ForgotPasswordRequest"
            responses:
                "200":
                    description: Reset email sent
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                success:
                                    value:
                                        message: "Please check your email to reset your password!"
                "400":
                    description: Missing/invalid email
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                missing:
                                    value:
                                        message: "Invalid/Missing credentials..."
                "404":
                    $ref: "../../docs/components.yaml#/components/responses/NotFound"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /auth/reset-password:
        post:
            tags: [Auth]
            summary: Reset password
            description: |
                Resets password for a user (by email) after validating the new password format and ensuring it's not reused.
                Note: Current behavior does not verify OTP here.
            security: [] # public
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "../../docs/components.yaml#/components/schemas/ResetPasswordRequest"
            responses:
                "200":
                    description: Password reset completed
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                success:
                                    value:
                                        message: "Your password has been reset successfully!"
                "400":
                    description: Validation error (missing password, weak password, reused password, etc.)
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                missing:
                                    value:
                                        message: "Invalid/Missing credentials..."
                                weak:
                                    value:
                                        message: "Password must be 8-18 characters and include both letters and numbers."
                                reused:
                                    value:
                                        message: "You have already used this password previously..."
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /auth/user:
        get:
            tags: [Auth]
            summary: Get current authenticated user
            description: Returns the authenticated user's profile (SAFE_USER fields) including followings, followers, and posts.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: Current user returned
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    user:
                                        $ref: "../../docs/components.yaml#/components/schemas/UserProfile"
                                required: [user]
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"
