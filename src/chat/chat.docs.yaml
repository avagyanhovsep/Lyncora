paths:
    /chats:
        get:
            tags: [Chats]
            summary: Load my chats
            description: Returns all chats for the authenticated user, including members (SAFE_USER fields) and the latest message (limit 1) per chat.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: Chats returned
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    chats:
                                        type: array
                                        items:
                                            $ref: "../../docs/components.yaml#/components/schemas/Chat"
                                required: [chats]
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /chats/dm:
        post:
            tags: [Chats]
            summary: Create or load a DM chat with a partner
            description: Finds an existing 1:1 chat between the authenticated user and partner; otherwise creates a new one and returns it. Enforces private-account messaging rules.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "../../docs/components.yaml#/components/schemas/CreateDMRequest"
            responses:
                "200":
                    description: Chat loaded/created
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    chat:
                                        $ref: "../../docs/components.yaml#/components/schemas/Chat"
                                required: [chat]
                "400":
                    description: Missing/invalid partnerId, or attempting to DM yourself
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                invalid:
                                    value:
                                        message: "Missing/Invalid ID..."
                                self:
                                    value:
                                        message: "Cannot DM yourself..."
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    description: Partner account is private and messaging is not allowed
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                private:
                                    value:
                                        message: "This account is private, follow to message..."
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /chats/{chatId}/messages:
        get:
            tags: [Chats]
            summary: Get messages for a chat
            description: Returns messages for the chat if the authenticated user is a member. If the member has cleared the chat, only returns messages after clearedAt.
            security:
                - bearerAuth: []
            parameters:
                - $ref: "../../docs/components.yaml#/components/parameters/ChatIdParam"
            responses:
                "200":
                    description: Messages returned
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    messages:
                                        type: array
                                        items:
                                            $ref: "../../docs/components.yaml#/components/schemas/ChatMessage"
                                required: [messages]
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    description: Not a member of this chat
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                forbidden:
                                    value:
                                        message: "Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

        post:
            tags: [Chats]
            summary: Send a message in a chat
            description: Creates a new message in the chat. Blocks if partner deleted their account or privacy rules disallow messaging.
            security:
                - bearerAuth: []
            parameters:
                - $ref: "../../docs/components.yaml#/components/parameters/ChatIdParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "../../docs/components.yaml#/components/schemas/SendMessageRequest"
            responses:
                "201":
                    description: Message created
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        $ref: "../../docs/components.yaml#/components/schemas/ChatMessage"
                                required: [message]
                "400":
                    description: Missing/invalid message text (if service returns null or upstream validation fails)
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                invalid:
                                    value:
                                        message: "Missing/Invalid credentials..."
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    description: Not a member, or messaging not allowed due to private-account rules
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                forbidden:
                                    value:
                                        message: "Forbidden"
                                private:
                                    value:
                                        message: "Sending message is not allowed, follow to message..."
                "410":
                    description: Partner deleted their account; you cannot send new messages
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                gone:
                                    value:
                                        message: "This user deleted their account. You can’t send new messages."
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /chats/{chatId}/read:
        post:
            tags: [Chats]
            summary: Mark chat as read
            description: Updates the member lastReadAt timestamp for the authenticated user in this chat.
            security:
                - bearerAuth: []
            parameters:
                - $ref: "../../docs/components.yaml#/components/parameters/ChatIdParam"
            responses:
                "200":
                    description: Chat marked as read
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                ok:
                                    value:
                                        message: "Message read!"
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    description: Not a member of this chat
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                forbidden:
                                    value:
                                        message: "Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /chats/{chatId}/messages/{messageId}:
        delete:
            tags: [Chats]
            summary: Unsend (delete) one of my messages
            description: Soft-deletes the message (paranoid). Only the sender can unsend their message. Must be a chat member.
            security:
                - bearerAuth: []
            parameters:
                - $ref: "../../docs/components.yaml#/components/parameters/ChatIdParam"
                - $ref: "../../docs/components.yaml#/components/parameters/MessageIdParam"
            responses:
                "200":
                    description: Message deleted
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    messageId:
                                        type: integer
                                        example: 55
                                required: [messageId]
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    description: Not a member, or you can unsend only your own messages
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                forbidden:
                                    value:
                                        message: "Forbidden"
                                not_owner:
                                    value:
                                        message: "You can unsend only your messages"
                "404":
                    description: Message not found in this chat
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                not_found:
                                    value:
                                        message: "Message not found"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /chats/{chatId}:
        delete:
            tags: [Chats]
            summary: Delete conversation for me
            description: Hides the chat for the authenticated user by setting Member.deletedAt/clearedAt/lastReadAt to now. (Chat may be auto-deleted if last member leaves via hooks.)
            security:
                - bearerAuth: []
            parameters:
                - $ref: "../../docs/components.yaml#/components/parameters/ChatIdParam"
            responses:
                "200":
                    description: Conversation hidden for user
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                ok:
                                    value:
                                        message: "Chat hidden"
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    description: Not a member of this chat
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                forbidden:
                                    value:
                                        message: "Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"
