paths:
    /posts/{postId}/comments:
        get:
            tags: [Comment]
            summary: Get all comments for a post
            description: Returns comments for the post, including the comment author (SAFE_USER fields) and reaction rows.
            security:
                - bearerAuth: []
            parameters:
                - name: postId
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 10
            responses:
                "200":
                    description: Comments returned
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    comments:
                                        type: array
                                        items:
                                            $ref: "../../docs/components.yaml#/components/schemas/Comment"
                                required: [comments]
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

        post:
            tags: [Comment]
            summary: Add a comment to a post
            description: Creates a new comment on the post.
            security:
                - bearerAuth: []
            parameters:
                - name: postId
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 10
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                text:
                                    type: string
                                    example: "Nice post!"
                            required: [text]
            responses:
                "201":
                    description: Comment created
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    comment:
                                        $ref: "../../docs/components.yaml#/components/schemas/Comment"
                                required: [comment]
                "400":
                    description: Missing/invalid comment text (if enforced upstream)
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                invalid:
                                    value:
                                        message: "Invalid/Missing credentials..."
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /posts/{postId}/comments/{commentId}:
        delete:
            tags: [Comment]
            summary: Delete my comment
            description: Deletes a comment if the authenticated user is the comment author.
            security:
                - bearerAuth: []
            parameters:
                - name: postId
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 10
                - name: commentId
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 77
            responses:
                "200":
                    description: Comment deleted
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                ok:
                                    value:
                                        message: "Comment deleted successfully!"
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    description: Forbidden (not the author)
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                forbidden:
                                    value:
                                        message: "Forbidden"
                "404":
                    description: Comment not found
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                not_found:
                                    value:
                                        message: "Comment not found..."
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /posts/{postId}/comments/{commentId}/reactions:
        post:
            tags: [Comment]
            summary: React / unreact to a comment
            description: |
                Toggles the authenticated user's reaction on the comment.
                If already reacted, it removes the reaction and returns `{ commentReactionStatus: false }`.
                If not reacted, it creates a reaction and returns `{ commentReactionStatus: true, commentReaction }`.
            security:
                - bearerAuth: []
            parameters:
                - name: postId
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 10
                - name: commentId
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 77
            responses:
                "200":
                    description: Reaction removed (already existed)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    commentReactionStatus:
                                        type: boolean
                                        example: false
                                required: [commentReactionStatus]
                            examples:
                                unreacted:
                                    value:
                                        commentReactionStatus: false
                "201":
                    description: Reaction created
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    commentReactionStatus:
                                        type: boolean
                                        example: true
                                    commentReaction:
                                        $ref: "../../docs/components.yaml#/components/schemas/CommentReaction"
                                required:
                                    [commentReactionStatus, commentReaction]
                            examples:
                                reacted:
                                    value:
                                        commentReactionStatus: true
                                        commentReaction:
                                            id: 12
                                            commentId: 77
                                            userId: 200
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

        get:
            tags: [Comment]
            summary: Get reactions for a comment
            description: Not implemented in current controller (placeholder route exists).
            security:
                - bearerAuth: []
            parameters:
                - name: postId
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 10
                - name: commentId
                  in: path
                  required: true
                  schema:
                      type: integer
                      example: 77
            responses:
                "501":
                    description: Not implemented
                    content:
                        application/json:
                            schema:
                                $ref: "../../docs/components.yaml#/components/schemas/MessageResponse"
                            examples:
                                not_implemented:
                                    value:
                                        message: "Not implemented"
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"
