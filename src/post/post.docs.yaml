paths:
    /posts:
        post:
            tags: [Post]
            summary: Create a new post
            description: Uploads an image to S3 and creates a post with optional tags and location.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required: [postImage]
                            properties:
                                postImage:
                                    type: string
                                    format: binary
                                title:
                                    type: string
                                description:
                                    type: string
                                location:
                                    type: string
                                tags:
                                    type: string
                                    description: JSON stringified array of tags.
            responses:
                "201":
                    description: Post created successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    postInfo:
                                        $ref: "../../docs/components.yaml#/components/schemas/Post"
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "413":
                    description: File too large (Max 15MB)
                "415":
                    description: Unsupported file type
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /posts/{postId}:
        get:
            tags: [Post]
            summary: Get detailed post information
            description: Returns post details including author info, comments (with reactions), and post reactions.
            parameters:
                - name: postId
                  in: path
                  required: true
                  schema:
                      type: integer
            responses:
                "200":
                    description: Post details retrieved
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    postInfo:
                                        $ref: "../../docs/components.yaml#/components/schemas/PostFull"
                "404":
                    $ref: "../../docs/components.yaml#/components/responses/NotFound"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

        delete:
            tags: [Post]
            summary: Delete a post
            description: Deletes the post record and its associated image from S3. Only the author can delete.
            security:
                - bearerAuth: []
            parameters:
                - name: postId
                  in: path
                  required: true
                  schema:
                      type: integer
            responses:
                "200":
                    $ref: "../../docs/components.yaml#/components/responses/SuccessMessage"
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "404":
                    $ref: "../../docs/components.yaml#/components/responses/NotFound"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

    /posts/{postId}/likes:
        get:
            tags: [Post]
            summary: Get all reactions for a post
            parameters:
                - name: postId
                  in: path
                  required: true
                  schema:
                      type: integer
            responses:
                "200":
                    description: List of reactions
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    reactions:
                                        type: array
                                        items:
                                            $ref: "../../docs/components.yaml#/components/schemas/PostReaction"
                "404":
                    $ref: "../../docs/components.yaml#/components/responses/NotFound"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"

        post:
            tags: [Post]
            summary: Toggle like on a post
            description: If the user has already liked the post, this will unlike it.
            security:
                - bearerAuth: []
            parameters:
                - name: postId
                  in: path
                  required: true
                  schema:
                      type: integer
            responses:
                "200":
                    description: Reaction status updated
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    reactionStatus:
                                        type: boolean
                                        description: True if liked, False if unliked.
                                    reaction:
                                        $ref: "../../docs/components.yaml#/components/schemas/PostReaction"
                "401":
                    $ref: "../../docs/components.yaml#/components/responses/Unauthorized"
                "403":
                    $ref: "../../docs/components.yaml#/components/responses/Forbidden"
                "404":
                    $ref: "../../docs/components.yaml#/components/responses/NotFound"
                "500":
                    $ref: "../../docs/components.yaml#/components/responses/InternalServerError"
